[package]
name = "lumend"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Adaptive screen brightness for Wayland laptops without a light sensor"
license = "MIT"
repository = "https://github.com/DaanHessen/lumend"
readme = "README.md"
keywords = ["brightness", "backlight", "wayland", "hyprland"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
rustix = { version = "1", features = ["event", "fs", "mm", "shm"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[profile.test]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
